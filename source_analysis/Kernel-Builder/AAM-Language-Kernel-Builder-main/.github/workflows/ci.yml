name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build, Lint & Test (Node & Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Lint Check
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Run TypeScript Unit Tests
        run: npm test

      - name: Run Python Core Unit Tests
        run: npm run test:python
